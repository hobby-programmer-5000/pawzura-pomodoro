name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: windows
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, MIT
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, MIT
        with:
          python-version: "3.14"
          architecture: x64
      - name: Install pinned runtime
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Record test environment
        run: python -c "import platform, PySide6; print(platform.platform()); print(platform.python_version()); print('PySide6', PySide6.__version__)"
      - name: Test application behavior
        run: python -m unittest discover -s tests -v
      - name: Exercise isolated native widgets
        run: python -m pomodoro --smoke-check --smoke-output .cache/ci-smoke.json
      - name: Check documentation and asset inventories
        run: python scripts/check_docs.py
